name: Deploy Supabase Edge Functions

on:
  workflow_dispatch: # allows manual "Run workflow" button on GitHub Actions
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        run: |
          supabase functions deploy extract-menu            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy voice-order             --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy generate-menu-image     --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy support-chat            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy create-razorpay-order   --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy verify-razorpay-payment --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy admin-list-accounts     --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy admin-approve-account   --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
