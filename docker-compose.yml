version: "3.9"

services:
  # ── React frontend served by nginx ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # Vite bakes these into the JS bundle at build time.
      # Set real values in Dokploy → Service → Build Env Vars (or a .env file).
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
        # VITE_API_URL is intentionally NOT listed here — it is hardcoded to ""
        # inside the Dockerfile so Dokploy env vars can never override it.
    # Do NOT bind host ports — Dokploy's Traefik reads the domain config
    # and routes traffic to this container on port 80 internally.
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Express / Passport auth server ─────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}           # e.g. https://yourdomain.com
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
    volumes:
      # Persist uploaded files across container restarts / re-deploys
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  uploads_data:
