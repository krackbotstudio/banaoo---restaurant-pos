server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Increase timeouts for slow API calls / file uploads
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 10M;

    # ── React auth page route (must not proxy to backend) ─────────────────────
    location = /auth {
        try_files $uri $uri/ /index.html;
    }

    # ── Express auth routes ────────────────────────────────────────────────────
    location /auth/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Forward cookies so sessions work across the proxy
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
    }

    # ── Express API routes ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
    }

    # ── APK downloads (served by Express; avoids SPA 404 on /downloads/*.apk) ──
    location /downloads/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
    }

    # ── Uploaded file assets ───────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── React SPA – catch-all for client-side routing ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable nginx version in error pages
    server_tokens off;
}
