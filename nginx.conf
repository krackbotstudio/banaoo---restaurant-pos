client_max_body_size 10M;

    # ── React auth page route (must not proxy to backend) ─────────────────────
    # ── React auth page routes (must NOT proxy to backend) ────────────────────
    location = /auth {
        try_files $uri $uri/ /index.html;
    }
    location = /auth/callback {
        try_files $uri $uri/ /index.html;
    }

    # ── Express auth routes (proxy to backend) ────────────────────────────────
    # We proxy all /auth/ prefixed routes EXCEPT the exact React routes handled above.
    location /auth/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
    }

    # ── Express API routes ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
    }

   # ── Uploaded file assets ───────────────────────────────────────────────────
location /uploads/ {
proxy_pass         http://backend:5000;