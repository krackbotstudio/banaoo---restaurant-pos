server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver — prevents startup crashes if backend is booting
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:5000;

    # Increase timeouts for slow API calls / file uploads
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 10M;

    # ── React auth page routes (must NOT proxy to backend) ────────────────────
    location = /auth {
        try_files $uri $uri/ /index.html;
    }
    location = /auth/callback {
        try_files $uri $uri/ /index.html;
    }

    # ── Express auth routes (proxy to backend) ────────────────────────────────
    # We proxy all /auth/ prefixed routes EXCEPT the exact React routes handled above.
    location /auth/ {
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
    }

    # ── Express API routes ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
    }

    # ── Uploaded file assets ───────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── React SPA – catch-all for client-side routing ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable nginx version in error pages
    server_tokens off;
}