    <!-- Structured Data: Organization (drives Knowledge Panel) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "banaoo",
        "alternateName": "banaoo.io",
        "url": "https://banaoo.io",
        "logo": "https://banaoo.io/logo.png",
        "description": "All-in-one restaurant management platform for Indian restaurants, cloud kitchens, QSRs and self-service counters.",
        "foundingDate": "2025",
        "areaServed": "IN",
        "sameAs": [
          "https://twitter.com/banaoo_io",
          "https://www.linkedin.com/company/banaoo",
          "https://www.instagram.com/banaoo.io",
          "https://www.youtube.com/@banaoo"

            "email": "support@banaoo.io",
            "areaServed": "IN",

          }
        ]

    </script>

        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "banaoo",
        "url": "https://banaoo.io",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://banaoo.io/docs?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

          "@type": "Organization",
          "name": "banaoo",

        }
